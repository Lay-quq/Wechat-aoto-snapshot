name: Windows
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      # This job checks source and compilation, not packaged media execution.
      # Release packaging prepares and verifies the complete runtime separately.
      - name: Install source-check dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Prepare the compiler
        run: npm rebuild esbuild
      - run: npm run verify:source
      - run: npm run test:source
      - run: npm run typecheck
      - run: npm run build:compile
